<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
<meta charset="UTF-8">
<title>パスワード変更</title>
</head>
<link th:href="@{/css/main.css}" rel="stylesheet" type="text/css">
<body style="background-color: rgb(0, 128, 255);">
	<h1>パスワード変更</h1>
	<form th:action="@{/passwordOK}" method="post" th:object="${passwordEdit}">
		現在のパスワード:<input type="password" th:field="*{oldPass}"><br>
		新しいパスワード:<input type="password" th:field="*{newPass}"><br>
		新しいパスワード（再入力）:<input type="password" th:field="*{newPass2}"><br>
		<ul th:if="${#fields.hasErrors('*')}" style="color:red">
			<li th:each="err:${#fields.errors('*')}" th:text="${err}"></li>
		</ul>
		<input class="btn"type="submit" value="上記に変更する">
	</form>
	<a class="menu" th:href="@{/userInfo}">⚙️ユーザ情報画面へもどる</a> 
</body>
</html>
